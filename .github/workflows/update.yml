name: Update Bible and news content
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'scripts/update.py'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
concurrency:
  group: daily-bread-content
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve Bible and news
        run: python scripts/update.py
      - name: Validate generated website content
        run: python scripts/check_site.py
      - name: Commit refreshed content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/bible.json content/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Bible and news content"
            git push
          else
            echo "No changes to publish"
          fi
