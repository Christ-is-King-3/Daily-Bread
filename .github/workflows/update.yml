name: Update Bible and news content
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'scripts/update.py'
      - 'scripts/process_news.js'
      - 'assets/news.js'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  issues: write
concurrency:
  group: daily-bread-content
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve Bible and news
        run: python scripts/update.py
      - name: Validate generated website content
        run: python scripts/check_site.py
      - name: Commit refreshed content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/bible.json content/news.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Bible and news content"
            # Other website updates can land while RSS is being fetched.
            # Rebase our generated-data commit and retry rather than losing a refresh.
            for attempt in 1 2 3 4; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "Unable to push refreshed news after four attempts" >&2
                exit 1
              fi
              sleep 2
            done
          else
            echo "No changes to publish"
          fi
      - name: Maintain editorial review queue
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/report_news_coverage.py
