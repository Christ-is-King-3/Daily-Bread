name: UK-hours website health and recovery
on:
  schedule:
    # UTC hours that cover 09:00, 11:00, 13:00 and 15:00 UK time in GMT and BST.
    # The script uses Europe/London to run exactly four checks, seven days a week.
    - cron: '7 8-15 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  issues: write
  pages: write
concurrency:
  group: daily-bread-health-recovery
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser checker
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify all public pages and recover supported faults
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_LIVE_BROWSER_CHECKS: '1'
        run: python scripts/health_recovery.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-health-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 14
