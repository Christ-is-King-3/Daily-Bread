name: Validate website changes
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check website and content
        run: python scripts/check_site.py
      - name: Verify health and recovery tooling
        run: |
          python -m py_compile scripts/health_recovery.py scripts/test_health_recovery.py
          python scripts/test_health_recovery.py
